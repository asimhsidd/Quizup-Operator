name: build-and-push

# Lint + build, then publish the image to GHCR; Coolify on kwiz-prod pulls it.
# Same pipeline as Quizup's build-and-push.yml (see Quizup/docs/deployment.md).
#
#   ghcr.io/asimhsidd/quizup-operator  :main (Coolify tracks this) and :sha-<shortsha>

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'   # matches the Dockerfile
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  image:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # BuildKit and the base images come from AWS ECR Public's mirror of Docker's official
      # images: Docker Hub rate-limits GitHub's shared runners (429s on 2026-10-10).
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=public.ecr.aws/vend/moby/buildkit:buildx-stable-1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/asimhsidd/quizup-operator
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Public value, baked into the bundle. Repository variable, defaulting to prod.
          build-args: |
            VITE_BACKEND_URL=${{ vars.VITE_BACKEND_URL || 'https://api.kwiz.live' }}
      - name: Trigger Coolify redeploy
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        if: ${{ env.COOLIFY_WEBHOOK != '' }}
        continue-on-error: true
        run: .github/scripts/coolify-deploy.sh
